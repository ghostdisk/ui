<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Region table lives in ui.ts (UI.atlas). Keep >= 4px of empty space between regions. -->
  <defs>
    <linearGradient id="btnFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="0.5" stop-color="#4a93f0"/>
      <stop offset="1" stop-color="#3270d8"/>
    </linearGradient>
    <linearGradient id="btnFaceHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dd2ff"/>
      <stop offset="0.5" stop-color="#62a6ff"/>
      <stop offset="1" stop-color="#3f80ea"/>
    </linearGradient>
    <linearGradient id="btnFaceDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a62c4"/>
      <stop offset="0.35" stop-color="#3a7ee0"/>
      <stop offset="1" stop-color="#4a8ff0"/>
    </linearGradient>
    <linearGradient id="btnShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btnInnerShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- white: 8x8 solid at (0,0); solid-colour quads sample its centre -->
  <rect x="0" y="0" width="8" height="8" fill="#fff"/>

  <!-- All button states: 64x52 regions, insets l12 t12 r12 b20. Face is 40px tall above a 4px lip. -->

  <!-- button: region (16,16) -->
  <g>
    <rect x="20" y="22" width="56" height="42" rx="9" fill="#000" opacity="0.45" filter="url(#soft)"/>
    <rect x="17" y="21" width="62" height="40" rx="8" fill="#1b4a94"/>
    <rect x="17" y="17" width="62" height="40" rx="8" fill="url(#btnFace)"/>
    <rect x="19" y="18" width="58" height="20" rx="7" fill="url(#btnShine)"/>
    <rect x="17.5" y="17.5" width="61" height="39" rx="7.5" fill="none" stroke="#bfe0ff" stroke-opacity="0.6"/>
    <rect x="16.5" y="16.5" width="63" height="45" rx="8.5" fill="none" stroke="#0e2a5c"/>
  </g>

  <!-- buttonHover: region (96,16); brighter face and rim -->
  <g transform="translate(80 0)">
    <rect x="20" y="22" width="56" height="42" rx="9" fill="#000" opacity="0.5" filter="url(#soft)"/>
    <rect x="17" y="21" width="62" height="40" rx="8" fill="#2158ad"/>
    <rect x="17" y="17" width="62" height="40" rx="8" fill="url(#btnFaceHover)"/>
    <rect x="19" y="18" width="58" height="20" rx="7" fill="url(#btnShine)"/>
    <rect x="17.5" y="17.5" width="61" height="39" rx="7.5" fill="none" stroke="#e0f0ff" stroke-opacity="0.8"/>
    <rect x="16.5" y="16.5" width="63" height="45" rx="8.5" fill="none" stroke="#0e2a5c"/>
  </g>

  <!-- buttonDown: region (176,16); face pushed 3px into the lip, inverted gradient, inner shadow -->
  <g transform="translate(160 0)">
    <rect x="20" y="23" width="56" height="40" rx="9" fill="#000" opacity="0.3" filter="url(#soft)"/>
    <rect x="17" y="21" width="62" height="40" rx="8" fill="#1b4a94"/>
    <rect x="17" y="20" width="62" height="40" rx="8" fill="url(#btnFaceDown)"/>
    <rect x="18" y="21" width="60" height="10" rx="7" fill="url(#btnInnerShadow)"/>
    <rect x="16.5" y="19.5" width="63" height="42" rx="8.5" fill="none" stroke="#0e2a5c"/>
  </g>

  <!-- check: region (256,16) 16x16, white tick for checkboxes -->
  <path d="M259.5 24.5 L263 28 L268.5 20.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- font: Arial 16, ASCII 32..126 in 20x20 cells, 16 per row from (0,128).
       Cell i = code - 32; pen at cell x + 2, baseline at cell y + 16. White, tinted at draw time.
       Generated; advances live in ui.ts (UI.atlas.font). -->
  <g font-family="Arial, Helvetica, Liberation Sans, sans-serif" font-size="16" fill="#fff" xml:space="preserve">
    <text x="22" y="144">!</text>
    <text x="42" y="144">"</text>
    <text x="62" y="144">#</text>
    <text x="82" y="144">$</text>
    <text x="102" y="144">%</text>
    <text x="122" y="144">&amp;</text>
    <text x="142" y="144">'</text>
    <text x="162" y="144">(</text>
    <text x="182" y="144">)</text>
    <text x="202" y="144">*</text>
    <text x="222" y="144">+</text>
    <text x="242" y="144">,</text>
    <text x="262" y="144">-</text>
    <text x="282" y="144">.</text>
    <text x="302" y="144">/</text>
    <text x="2" y="164">0</text>
    <text x="22" y="164">1</text>
    <text x="42" y="164">2</text>
    <text x="62" y="164">3</text>
    <text x="82" y="164">4</text>
    <text x="102" y="164">5</text>
    <text x="122" y="164">6</text>
    <text x="142" y="164">7</text>
    <text x="162" y="164">8</text>
    <text x="182" y="164">9</text>
    <text x="202" y="164">:</text>
    <text x="222" y="164">;</text>
    <text x="242" y="164">&lt;</text>
    <text x="262" y="164">=</text>
    <text x="282" y="164">&gt;</text>
    <text x="302" y="164">?</text>
    <text x="2" y="184">@</text>
    <text x="22" y="184">A</text>
    <text x="42" y="184">B</text>
    <text x="62" y="184">C</text>
    <text x="82" y="184">D</text>
    <text x="102" y="184">E</text>
    <text x="122" y="184">F</text>
    <text x="142" y="184">G</text>
    <text x="162" y="184">H</text>
    <text x="182" y="184">I</text>
    <text x="202" y="184">J</text>
    <text x="222" y="184">K</text>
    <text x="242" y="184">L</text>
    <text x="262" y="184">M</text>
    <text x="282" y="184">N</text>
    <text x="302" y="184">O</text>
    <text x="2" y="204">P</text>
    <text x="22" y="204">Q</text>
    <text x="42" y="204">R</text>
    <text x="62" y="204">S</text>
    <text x="82" y="204">T</text>
    <text x="102" y="204">U</text>
    <text x="122" y="204">V</text>
    <text x="142" y="204">W</text>
    <text x="162" y="204">X</text>
    <text x="182" y="204">Y</text>
    <text x="202" y="204">Z</text>
    <text x="222" y="204">[</text>
    <text x="242" y="204">\</text>
    <text x="262" y="204">]</text>
    <text x="282" y="204">^</text>
    <text x="302" y="204">_</text>
    <text x="2" y="224">`</text>
    <text x="22" y="224">a</text>
    <text x="42" y="224">b</text>
    <text x="62" y="224">c</text>
    <text x="82" y="224">d</text>
    <text x="102" y="224">e</text>
    <text x="122" y="224">f</text>
    <text x="142" y="224">g</text>
    <text x="162" y="224">h</text>
    <text x="182" y="224">i</text>
    <text x="202" y="224">j</text>
    <text x="222" y="224">k</text>
    <text x="242" y="224">l</text>
    <text x="262" y="224">m</text>
    <text x="282" y="224">n</text>
    <text x="302" y="224">o</text>
    <text x="2" y="244">p</text>
    <text x="22" y="244">q</text>
    <text x="42" y="244">r</text>
    <text x="62" y="244">s</text>
    <text x="82" y="244">t</text>
    <text x="102" y="244">u</text>
    <text x="122" y="244">v</text>
    <text x="142" y="244">w</text>
    <text x="162" y="244">x</text>
    <text x="182" y="244">y</text>
    <text x="202" y="244">z</text>
    <text x="222" y="244">{</text>
    <text x="242" y="244">|</text>
    <text x="262" y="244">}</text>
    <text x="282" y="244">~</text>
  </g>
</svg>
