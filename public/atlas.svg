<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Region table lives in ui.ts (UI.atlas). Keep >= 4px of empty space between regions. -->
  <defs>
    <linearGradient id="btnFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="0.5" stop-color="#4a93f0"/>
      <stop offset="1" stop-color="#3270d8"/>
    </linearGradient>
    <linearGradient id="btnFaceHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dd2ff"/>
      <stop offset="0.5" stop-color="#62a6ff"/>
      <stop offset="1" stop-color="#3f80ea"/>
    </linearGradient>
    <linearGradient id="btnFaceDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a62c4"/>
      <stop offset="0.35" stop-color="#3a7ee0"/>
      <stop offset="1" stop-color="#4a8ff0"/>
    </linearGradient>
    <linearGradient id="btnShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="btnInnerShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- white: 8x8 solid at (0,0); solid-colour quads sample its centre -->
  <rect x="0" y="0" width="8" height="8" fill="#fff"/>

  <!-- All button states: 64x52 regions, insets l12 t12 r12 b20. Face is 40px tall above a 4px lip. -->

  <!-- button: region (16,16) -->
  <g>
    <rect x="20" y="22" width="56" height="42" rx="9" fill="#000" opacity="0.45" filter="url(#soft)"/>
    <rect x="17" y="21" width="62" height="40" rx="8" fill="#1b4a94"/>
    <rect x="17" y="17" width="62" height="40" rx="8" fill="url(#btnFace)"/>
    <rect x="19" y="18" width="58" height="20" rx="7" fill="url(#btnShine)"/>
    <rect x="17.5" y="17.5" width="61" height="39" rx="7.5" fill="none" stroke="#bfe0ff" stroke-opacity="0.6"/>
    <rect x="16.5" y="16.5" width="63" height="45" rx="8.5" fill="none" stroke="#0e2a5c"/>
  </g>

  <!-- buttonHover: region (96,16); brighter face and rim -->
  <g transform="translate(80 0)">
    <rect x="20" y="22" width="56" height="42" rx="9" fill="#000" opacity="0.5" filter="url(#soft)"/>
    <rect x="17" y="21" width="62" height="40" rx="8" fill="#2158ad"/>
    <rect x="17" y="17" width="62" height="40" rx="8" fill="url(#btnFaceHover)"/>
    <rect x="19" y="18" width="58" height="20" rx="7" fill="url(#btnShine)"/>
    <rect x="17.5" y="17.5" width="61" height="39" rx="7.5" fill="none" stroke="#e0f0ff" stroke-opacity="0.8"/>
    <rect x="16.5" y="16.5" width="63" height="45" rx="8.5" fill="none" stroke="#0e2a5c"/>
  </g>

  <!-- buttonDown: region (176,16); face pushed 3px into the lip, inverted gradient, inner shadow -->
  <g transform="translate(160 0)">
    <rect x="20" y="23" width="56" height="40" rx="9" fill="#000" opacity="0.3" filter="url(#soft)"/>
    <rect x="17" y="21" width="62" height="40" rx="8" fill="#1b4a94"/>
    <rect x="17" y="20" width="62" height="40" rx="8" fill="url(#btnFaceDown)"/>
    <rect x="18" y="21" width="60" height="10" rx="7" fill="url(#btnInnerShadow)"/>
    <rect x="16.5" y="19.5" width="63" height="42" rx="8.5" fill="none" stroke="#0e2a5c"/>
  </g>
</svg>
